! Cisco 7200 Running Configuration
! Hostname: Cisco7200
! IOS Version: 15.x / 12.4

version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Cisco7200
!
boot-start-marker
boot-end-marker
!
!
crypto isakmp policy 10
 encr des
 hash sha256
 authentication pre-share
 group 14
!
crypto isakmp key ClaveSegura2024 address 202.40.88.1
!
!
crypto ipsec transform-set TS_VPN esp-des esp-sha-hmac
 mode tunnel
!
!
crypto map CM_FORTI 10 ipsec-isakmp
 set peer 202.40.88.1
 set transform-set TS_VPN
 match address 101
!
!
interface FastEthernet1/0
 description Connection to Local Server (LAN Sede B)
 ip address 172.20.24.1 255.255.255.240
 duplex auto
 speed auto
!
interface FastEthernet2/0
 description WAN Connection to FortiGate-A
 ip address 202.40.88.2 255.255.255.252
 duplex auto
 speed auto
 crypto map CM_FORTI
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
access-list 101 permit ip 172.20.24.0 0.0.0.15 192.168.86.0 0.0.0.127
!
control-plane
!
end
